services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: electricity
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5433:5432
  adminer:
    image: adminer
    restart: always
    ports:
      - 8088:8080
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://academy:academy@db:5432/electricity
      PORT: 4000
    ports:
      - 4000:4000
